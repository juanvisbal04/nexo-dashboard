name: One-off lossless NEXO logo conversion

on:
  push:
    branches: [perf/official-logo-webp-20261016]
    paths:
      - '.github/workflows/nexo-convert-logo.yml'

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Convert existing official logo — no generative design
        run: |
          python -m pip install --disable-pip-version-check pillow==11.3.0
          python - <<'PY'
          from PIL import Image, ImageChops
          from pathlib import Path
          src=Path('public/nexo-logo-oficial.png')
          im=Image.open(src).convert('RGBA')
          assert im.width>=400 and im.height>=100, 'unexpected approved-logo source dimensions'
          full=Path('public/nexo-logo-oficial.webp')
          small=Path('public/nexo-logo-oficial-400.webp')
          im.save(full,'WEBP',lossless=True,method=6,exact=True)
          resized=im.resize((400,round(im.height*400/im.width)),Image.Resampling.LANCZOS)
          resized.save(small,'WEBP',lossless=True,method=6,exact=True)
          test=Image.open(full).convert('RGBA')
          assert not ImageChops.difference(im,test).getbbox(), 'full WebP must match every original RGBA pixel'
          print('SOURCE',im.size,src.stat().st_size,'bytes')
          print('FULL LOSSLESS',test.size,full.stat().st_size,'bytes')
          print('RESPONSIVE 400W',resized.size,small.stat().st_size,'bytes')
          assert full.stat().st_size < src.stat().st_size, 'conversion must reduce file size'
          PY
      - name: Commit only derived logo files to this branch
        run: |
          git config user.name "NEXO QA"
          git config user.email "actions@users.noreply.github.com"
          git add public/nexo-logo-oficial.webp public/nexo-logo-oficial-400.webp
          if git diff --cached --quiet; then
            echo "No asset changes"
            exit 0
          fi
          git commit -m "perf(assets): lossless official NEXO WebP and mobile-size variant"
          git push origin HEAD:perf/official-logo-webp-20261016
