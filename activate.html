<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex,nofollow" />
  <meta name="theme-color" content="#111d35" />
  <title>Activar acceso | NEXO</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css?v=20261007-teaminvite1" />
</head>
<body>
  <div class="login-screen">
    <section class="login-card">
      <div class="logo-wrap">
        <div class="logo-word">NE<span>X</span>O</div>
        <div class="logo-by">by Juan Visbal</div>
      </div>
      <div class="login-copy">
        <span id="activateEyebrow" class="eyebrow">ACTIVAR ACCESO</span>
        <h1 id="activateTitle">Crea tu contraseña.</h1>
        <p id="activateSubtitle">Tu acceso ya fue autorizado por NEXO. Define una contraseña privada para entrar al dashboard de tu negocio.</p>
      </div>
      <form id="activateForm">
        <label>Nueva contraseña</label>
        <input id="password" type="password" minlength="10" autocomplete="new-password" required placeholder="Mínimo 10 caracteres" />
        <label>Confirmar contraseña</label>
        <input id="confirm" type="password" minlength="10" autocomplete="new-password" required placeholder="Repite la contraseña" />
        <button id="submit" class="btn primary" type="submit">Activar mi acceso</button>
      </form>
      <div id="message" class="message hidden"></div>
      <p id="activationSecurityNote" class="security-note">El enlace es personal y solo puede utilizarse una vez.</p>
    </section>
  </div>

<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js@2.58.0";

const SUPABASE_URL = "https://ixewnbjndguchunwcuhf.supabase.co";
const KEY = "sb_publishable_vFnLRe9cmnOcyz2Fivprhw_8UjBaRGL";
const query = new URLSearchParams(location.search);
const hash = new URLSearchParams(location.hash.slice(1));
const token = hash.get("token") || query.get("token");
const authType = hash.get("type") || "";
const teamMode = query.get("team") === "1" || authType === "invite" || authType === "signup";

const supabase = createClient(SUPABASE_URL, KEY, {
  auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true },
});

const form = document.getElementById("activateForm");
const message = document.getElementById("message");
const button = document.getElementById("submit");
const title = document.getElementById("activateTitle");
const subtitle = document.getElementById("activateSubtitle");
const eyebrow = document.getElementById("activateEyebrow");
const securityNote = document.getElementById("activationSecurityNote");

if (teamMode) {
  eyebrow.textContent = "BIENVENIDO A NEXO";
  title.textContent = "Completa tu registro.";
  subtitle.textContent = "Has sido invitado al equipo de NEXO. Crea tu contraseña para activar tu espacio de trabajo y los accesos asignados a tu rol.";
  button.textContent = "Completar registro";
  securityNote.textContent = "Invitación personal. Si fue cancelada por NEXO, el registro no podrá completarse.";
} else if (!token) {
  form.classList.add("hidden");
  message.textContent = "Este enlace de activación no es válido o ya expiró.";
  message.className = "message error";
}

async function getTeamSession() {
  const { data } = await supabase.auth.getSession();
  if (data?.session) return data.session;

  return await new Promise((resolve) => {
    let done = false;
    const finish = (session) => {
      if (done) return;
      done = true;
      sub?.data?.subscription?.unsubscribe();
      resolve(session || null);
    };
    const sub = supabase.auth.onAuthStateChange((_event, session) => finish(session));
    setTimeout(() => finish(null), 1800);
  });
}

if (teamMode) {
  const session = await getTeamSession();
  if (!session) {
    form.classList.add("hidden");
    message.textContent = "La invitación no es válida, expiró o ya fue utilizada. Solicita una nueva invitación a NEXO.";
    message.className = "message error";
  }
}

form.addEventListener("submit", async (event) => {
  event.preventDefault();
  message.className = "message hidden";

  const password = document.getElementById("password").value;
  const confirm = document.getElementById("confirm").value;

  if (password !== confirm) {
    message.textContent = "Las contraseñas no coinciden.";
    message.className = "message error";
    return;
  }

  if (password.length < 10 || !/[a-z]/.test(password) || !/[A-Z]/.test(password) || !/[0-9]/.test(password)) {
    message.textContent = "La contraseña debe tener mínimo 10 caracteres e incluir mayúscula, minúscula y número.";
    message.className = "message error";
    return;
  }

  button.disabled = true;
  button.textContent = teamMode ? "Completando…" : "Activando…";

  try {
    if (teamMode) {
      const session = await getTeamSession();
      if (!session) throw new Error("La invitación ya no es válida. Solicita una nueva invitación a NEXO.");

      const { data, error } = await supabase.functions.invoke("activate-team-invite", {
        body: { password },
      });
      if (error) throw error;
      if (!data?.ok) throw new Error(data?.error || "No pudimos completar tu registro.");

      form.classList.add("hidden");
      message.innerHTML = 'Registro completado correctamente.<br><br><a class="btn primary" href="https://dashboard.nexobyjv.online">Entrar a NEXO</a>';
      message.className = "message ok";
      return;
    }

    const response = await fetch(SUPABASE_URL + "/functions/v1/activate-client-access", {
      method: "POST",
      headers: { "content-type": "application/json", "apikey": KEY },
      body: JSON.stringify({ token, password })
    });
    const data = await response.json();
    if (!response.ok) throw new Error(data.error || "No pudimos activar el acceso.");

    form.classList.add("hidden");
    message.innerHTML = 'Acceso activado correctamente.<br><br><a class="btn primary" href="https://dashboard.nexobyjv.online">Ir al login de NEXO</a>';
    message.className = "message ok";
  } catch (error) {
    message.textContent = error.message || "No pudimos activar el acceso.";
    message.className = "message error";
    button.disabled = false;
    button.textContent = teamMode ? "Completar registro" : "Activar mi acceso";
  }
});
</script>
</body>
</html>
